[package]
name = "vitrin"
version = "1.0.0"
edition = "2021"
description = "GitHub projelerinizi vitrin şeklinde gösteren çok platformlu masaüstü kütüphane"
license = "MIT"
readme = "README.md"
repository = "https://github.com/KULLANICI/vitrin"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
